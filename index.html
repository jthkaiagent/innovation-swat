<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovation SWAT — Book Cover</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a1e;
      font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
      padding: 2rem;
    }

    /* ── Book container with 3D spine effect ── */
    .book {
      display: flex;
      filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6)) drop-shadow(0 10px 20px rgba(0,0,0,0.4));
      max-width: 720px;
      width: 100%;
      transition: transform 0.3s ease;
    }
    .book:hover {
      transform: translateY(-6px);
    }

    /* ── Spine ── */
    .spine {
      width: 36px;
      min-height: 560px;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 50%, #1a1a2e 100%);
      border-radius: 6px 0 0 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .spine::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.015) 3px,
        rgba(255,255,255,0.015) 4px
      );
      border-radius: 6px 0 0 6px;
      pointer-events: none;
    }
    .spine-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #c9a84c;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 300;
      opacity: 0.7;
    }

    /* ── Front Cover ── */
    .cover {
      flex: 1;
      min-height: 560px;
      background: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
      border-radius: 0 6px 6px 0;
      padding: 3rem;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ── Background texture ── */
    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 60% at 20% 30%, rgba(201, 168, 76, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 80% 50% at 80% 70%, rgba(15, 52, 96, 0.3) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Tactical grid overlay ── */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201, 168, 76, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201, 168, 76, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── Circuit / tactical decorative lines ── */
    .deco-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .deco-lines svg {
      width: 100%;
      height: 100%;
    }

    /* ── Accent bar ── */
    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #c9a84c 0%, transparent 80%);
    }
    .accent-bar-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(270deg, #c9a84c 20%, transparent 80%);
    }

    /* ── Content ── */
    .cover-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: center;
    }

    /* ── Top badge ── */
    .badge-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(201, 168, 76, 0.3);
      padding: 0.3rem 0.8rem;
      border-radius: 3px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #c9a84c;
      font-weight: 500;
    }
    .badge-dot {
      width: 4px;
      height: 4px;
      background: #c9a84c;
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ── Emblem / icon ── */
    .emblem-area {
      margin-bottom: 2.2rem;
    }
    .emblem {
      width: 48px;
      height: 48px;
      position: relative;
    }
    .emblem-ring {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(201, 168, 76, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .emblem-ring::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #c9a84c;
      border-radius: 50%;
    }
    .emblem-ring::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 50%;
    }
    .emblem-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .emblem-crosshair::before,
    .emblem-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(201, 168, 76, 0.15);
    }
    .emblem-crosshair::before {
      width: 60px;
      height: 1px;
      top: -0.5px;
      left: -30px;
    }
    .emblem-crosshair::after {
      width: 1px;
      height: 60px;
      left: -0.5px;
      top: -30px;
    }

    /* ── Title ── */
    .title-block {
      margin-bottom: 0.8rem;
    }
    .title-pre {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(201, 168, 76, 0.5);
      margin-bottom: 0.6rem;
      font-weight: 400;
    }
    .title-main {
      font-size: clamp(2.8rem, 5.5vw, 4rem);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
      line-height: 1.1;
      font-family: 'Georgia', 'Times New Roman', serif;
    }
    .title-main em {
      font-style: normal;
      color: #c9a84c;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-size: clamp(0.85rem, 1.3vw, 1rem);
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      max-width: 420px;
      font-weight: 300;
      letter-spacing: 0.02em;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border-left: 2px solid rgba(201, 168, 76, 0.4);
      padding-left: 1.2rem;
      margin-top: 1.2rem;
    }

    /* ── Bottom section ── */
    .cover-bottom {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 2rem;
    }
    .author {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 400;
    }
    .author strong {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }
    .series-mark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.5rem;
      letter-spacing: 0.15em;
      color: rgba(201, 168, 76, 0.3);
      text-align: right;
    }
    .series-mark span {
      display: block;
    }

    /* ── Floating particles ── */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #c9a84c;
      border-radius: 50%;
      opacity: 0;
      animation: float 8s infinite;
    }
    .particle:nth-child(1) { left: 15%; top: 30%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 55%; top: 20%; animation-delay: 1.5s; width: 3px; height: 3px; }
    .particle:nth-child(3) { left: 80%; top: 45%; animation-delay: 3s; }
    .particle:nth-child(4) { left: 30%; top: 70%; animation-delay: 2s; width: 1px; height: 1px; }
    .particle:nth-child(5) { left: 70%; top: 65%; animation-delay: 4s; }
    .particle:nth-child(6) { left: 45%; top: 85%; animation-delay: 5s; width: 3px; height: 3px; }
    .particle:nth-child(7) { left: 90%; top: 15%; animation-delay: 0.5s; }
    .particle:nth-child(8) { left: 10%; top: 55%; animation-delay: 3.5s; }

    @keyframes float {
      0%   { opacity: 0; transform: translateY(0) scale(0); }
      20%  { opacity: 0.6; transform: translateY(-20px) scale(1); }
      80%  { opacity: 0.6; transform: translateY(-60px) scale(0.8); }
      100% { opacity: 0; transform: translateY(-80px) scale(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body { padding: 1rem; }
      .spine { width: 24px; min-height: 400px; }
      .cover { min-height: 400px; padding: 1.5rem; }
      .cover-content { justify-content: flex-start; padding-top: 0.5rem; }
      .badge-row { margin-bottom: 1rem; }
      .emblem-area { margin-bottom: 1.2rem; }
      .emblem { width: 36px; height: 36px; }
      .emblem-ring { width: 36px; height: 36px; }
      .title-main { font-size: clamp(1.8rem, 8vw, 2.8rem); }
      .subtitle { font-size: 0.75rem; padding-left: 0.8rem; margin-top: 0.8rem; }
      .accent-bar, .accent-bar-bottom { height: 3px; }
    }

    @media print {
      body { background: white; padding: 0; }
      .book { filter: none; max-width: 100%; }
      .spine, .cover { min-height: 8.5in; }
      .particle { display: none; }
    }

    /* ── In-page capture info ── */
    .note {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: -apple-system, sans-serif;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
  </style>
</head>
<body>

<div class="book">
  <!-- Spine -->
  <div class="spine">
    <span class="spine-text">Innovation SWAT</span>
  </div>

  <!-- Front Cover -->
  <div class="cover">
    <div class="accent-bar"></div>
    <div class="accent-bar-bottom"></div>
    <div class="grid-overlay"></div>

    <!-- Decorative circuit lines -->
    <div class="deco-lines">
      <svg viewBox="0 0 600 560" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M500 480 L500 400 L440 400" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>
        <circle cx="436" cy="400" r="3" fill="#c9a84c" opacity="0.15"/>
        <path d="M550 200 L550 120 L480 120" stroke="#c9a84c" stroke-width="0.5" opacity="0.12"/>
        <circle cx="476" cy="120" r="3" fill="#c9a84c" opacity="0.12"/>
        <path d="M30 100 L30 180 L100 180" stroke="#c9a84c" stroke-width="0.5" opacity="0.1"/>
        <circle cx="104" cy="180" r="3" fill="#c9a84c" opacity="0.1"/>
        <path d="M20 400 L20 320 L90 320" stroke="#c9a84c" stroke-width="0.5" opacity="0.08"/>
      </svg>
    </div>

    <!-- Floating particles -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Content -->
    <div class="cover-content">
      <div class="badge-row">
        <div class="badge">
          <span class="badge-dot"></span>
          A New Breed of Leadership
        </div>
      </div>

      <div class="emblem-area">
        <div class="emblem">
          <div class="emblem-ring"></div>
          <div class="emblem-crosshair"></div>
        </div>
      </div>

      <div class="title-block">
        <div class="title-pre">A Manifesto for the Age of Intelligence</div>
        <h1 class="title-main">Innovation<br><em>SWAT</em></h1>
      </div>

      <div class="subtitle">
        The Superpower to Build Any Business<br>
        and Product in the Age of AI
      </div>
    </div>

    <!-- Bottom -->
    <div class="cover-bottom">
      <div class="author">
        Written by <strong>Justin Tsui</strong>
      </div>
      <div class="series-mark">
        <span>✦ &nbsp;FRAMEWORKS FOR THE NEW WORLD&nbsp; ✦</span>
      </div>
    </div>
  </div>
</div>

<div class="note">📸 Screenshot or print this page &mdash; the cover is designed for capture</div>

</body>
</html>
