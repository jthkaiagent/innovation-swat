<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovation SWAT — Book Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,700&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+JP:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #1a1a1e;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    /* ── Style Switcher ── */
    .switcher {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .switcher button {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      padding: 0.4rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.5);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .switcher button:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    .switcher button.active { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }

    /* ── Book ── */
    .book {
      display: flex;
      filter: drop-shadow(0 30px 60px rgba(0,0,0,0.5)) drop-shadow(0 10px 20px rgba(0,0,0,0.3));
      max-width: 540px;  /* 6:9 ratio scaled down */
      width: 100%;
      transition: transform 0.3s ease;
    }
    .book:hover { transform: translateY(-6px); }

    /* ── Spine ── */
    .spine {
      width: 30px;
      min-height: 810px;  /* 9 inches proportion */
      background: linear-gradient(180deg, #c0553e 0%, #9a3a22 100%);
      border-radius: 5px 0 0 5px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .spine::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
      border-radius: 5px 0 0 5px;
      pointer-events: none;
    }
    .spine-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: rgba(255,255,255,0.8);
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    /* ── Front Cover ── */
    .cover {
      flex: 1;
      min-height: 810px;
      border-radius: 0 5px 5px 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-size: cover;
      background-position: center;
    }

    /* ── Dark overlay for text legibility ── */
    .cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.10) 70%, rgba(0,0,0,0.20) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── Decorative accent bars ── */
    .accent-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, rgba(255,200,150,0.6) 0%, transparent 80%);
      z-index: 3;
    }
    .accent-bar-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(270deg, rgba(255,200,150,0.5) 20%, transparent 80%);
      z-index: 3;
    }

    /* ── Text content ── */
    .cover-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: center;
      padding: 3rem 2.8rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.3rem 0.8rem;
      border-radius: 3px;
      font-size: 0.5rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      font-weight: 400;
      margin-bottom: 2.5rem;
      align-self: flex-start;
    }
    .badge-dot {
      width: 4px; height: 4px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
    }

    .emblem-area { margin-bottom: 2rem; }
    .emblem {
      width: 44px; height: 44px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .emblem::before { content: '✦'; color: rgba(255,255,255,0.5); font-size: 1.1rem; }
    .emblem::after {
      content: ''; position: absolute; inset: -4px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .title-pre {
      font-size: 0.5rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.4rem;
      font-weight: 400;
    }

    .title-main {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(2.6rem, 5.5vw, 3.8rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.01em;
      line-height: 1.05;
      text-shadow: 0 1px 30px rgba(0,0,0,0.15);
    }
    .title-main .swat {
      display: inline-block;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 25px rgba(255,150,100,0.25);
      position: relative;
    }
    .title-main .swat::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 0; right: 0;
      height: 3px;
      background: rgba(255,200,150,0.2);
      border-radius: 2px;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.7rem, 1vw, 0.85rem);
      color: rgba(255,255,255,0.7);
      line-height: 1.55;
      max-width: 340px;
      font-weight: 300;
      letter-spacing: 0.03em;
      border-left: 3px solid rgba(255,200,150,0.3);
      padding-left: 1rem;
      margin-top: 1.4rem;
    }

    .cover-bottom {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 1.8rem 2.8rem;
    }
    .author {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.45);
      font-weight: 300;
    }
    .author strong {
      color: rgba(255,255,255,0.7);
      font-weight: 500;
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
    }
    .series-mark {
      font-size: 0.4rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.2);
      text-align: right;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body { padding: 1rem; }
      .spine { width: 20px; min-height: 480px; }
      .cover { min-height: 480px; }
      .cover-content { padding: 1.5rem 1.5rem; }
      .badge { margin-bottom: 1.5rem; }
      .emblem-area { margin-bottom: 1.2rem; }
      .title-main { font-size: clamp(1.8rem, 7vw, 2.6rem); }
      .subtitle { font-size: 0.65rem; padding-left: 0.7rem; margin-top: 1rem; max-width: 220px; }
      .cover-bottom { padding: 1rem 1.5rem; }
    }

    @media print {
      body { background: white; padding: 0; }
      .book { filter: none; max-width: 100%; }
      .switcher { display: none; }
    }

    .note {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.25);
      margin-top: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="switcher" id="switcher">
  <button class="active" data-bg="1">Variant A</button>
  <button data-bg="2">Variant B</button>
  <button data-bg="3">Variant C</button>
</div>

<div class="book">
  <div class="spine">
    <span class="spine-text">Innovation SWAT</span>
  </div>

  <div class="cover" id="cover">
    <div class="cover-overlay"></div>
    <div class="accent-bar"></div>
    <div class="accent-bar-bottom"></div>

    <div class="cover-content">
      <div class="badge">
        <span class="badge-dot"></span>
        A New Breed of Leadership
      </div>

      <div class="emblem-area">
        <div class="emblem"></div>
      </div>

      <div class="title-pre">A Manifesto for the Age of Intelligence</div>
      <h1 class="title-main">
        Innovation<br>
        <span class="swat">SWAT</span>
      </h1>

      <div class="subtitle">
        The Superpower to Build Any Business<br>
        and Product in the Age of AI
      </div>
    </div>

    <div class="cover-bottom">
      <div class="author">
        Written by <strong>Justin Tsui</strong>
      </div>
      <div class="series-mark">
        ✦ &nbsp;FRAMEWORKS FOR THE NEW WORLD&nbsp; ✦
      </div>
    </div>
  </div>
</div>

<p class="note">📸 Screenshot this page • 6×9 inch proportion • Clean overlaid typography</p>

<script>
  const cover = document.getElementById('cover');
  const buttons = document.querySelectorAll('.switcher button');
  const variants = [
    'url(bg_v1.jpg)',
    'url(bg_v2.jpg)',
    'url(bg_v3.jpg)'
  ];

  buttons.forEach((btn, i) => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      cover.style.backgroundImage = variants[i];
    });
  });

  // Default: v2 (largest file)
  cover.style.backgroundImage = variants[1];
</script>

</body>
</html>
