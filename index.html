<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovation SWAT — Book Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Noto+Sans+JP:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #1a1a1e;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .switcher {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .switcher button {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      padding: 0.35rem 0.8rem;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.4);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .switcher button:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
    .switcher button.active { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.25); }

    .book {
      display: flex;
      filter: drop-shadow(0 30px 60px rgba(0,0,0,0.5)) drop-shadow(0 10px 20px rgba(0,0,0,0.3));
      max-width: 540px;
      width: 100%;
      transition: transform 0.3s ease;
    }
    .book:hover { transform: translateY(-6px); }

    .spine {
      width: 30px;
      min-height: 810px;
      background: linear-gradient(180deg, #b84a30 0%, #8a3020 100%);
      border-radius: 5px 0 0 5px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .spine::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
      border-radius: 5px 0 0 5px;
      pointer-events: none;
    }
    .spine-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: rgba(255,255,255,0.7);
      font-size: 0.55rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    .cover {
      flex: 1;
      min-height: 810px;
      border-radius: 0 5px 5px 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-size: cover;
      background-position: center;
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0.12) 0%,
        rgba(0,0,0,0.02) 30%,
        rgba(0,0,0,0.02) 60%,
        rgba(0,0,0,0.15) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .accent-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, rgba(255,200,150,0.5) 0%, transparent 80%);
      z-index: 5;
    }
    .accent-bar-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(270deg, rgba(255,200,150,0.4) 20%, transparent 80%);
      z-index: 5;
    }

    .title-area {
      position: relative;
      z-index: 3;
      padding: 3rem 2.5rem 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .title-img {
      width: 100%;
      max-width: 480px;
      height: auto;
      display: block;
      margin: 0;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.15));
    }

    .info-area {
      position: relative;
      z-index: 3;
      padding: 1.5rem 2.5rem 2rem;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.7rem, 1.1vw, 0.85rem);
      color: rgba(255,255,255,0.75);
      line-height: 1.55;
      max-width: 340px;
      font-weight: 300;
      letter-spacing: 0.04em;
      border-left: 3px solid rgba(255,200,150,0.3);
      padding-left: 1rem;
    }

    .cover-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .author {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.45);
      font-weight: 300;
    }
    .author strong {
      color: rgba(255,255,255,0.7);
      font-weight: 500;
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
    }
    .series-mark {
      font-size: 0.4rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.2);
      text-align: right;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .spine { width: 20px; min-height: 480px; }
      .cover { min-height: 480px; }
      .title-area { padding: 1.5rem 1.2rem 0; }
      .info-area { padding: 0.8rem 1.2rem 1.2rem; }
      .subtitle { font-size: 0.6rem; padding-left: 0.7rem; max-width: 200px; }
      .cover-bottom { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }

    @media print {
      body { background: white; padding: 0; }
      .book { filter: none; max-width: 100%; }
      .switcher { display: none; }
    }

    .note {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.25);
      margin-top: 1.5rem;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>

<div class="switcher" id="switcher">
  <button class="active" data-variant="1">🎨 Brush Calligraphy</button>
  <button data-variant="2">🖌 Sumi-e Ink</button>
  <button data-variant="3">✒️ Modern Expressive</button>
</div>

<div class="book">
  <div class="spine">
    <span class="spine-text">Innovation SWAT</span>
  </div>

  <div class="cover" id="cover">
    <div class="cover-overlay"></div>
    <div class="accent-bar"></div>
    <div class="accent-bar-bottom"></div>

    <div class="title-area">
      <img class="title-img" id="titleImg" src="title_v1.jpg" alt="Innovation SWAT — hand-lettered title">
    </div>

    <div class="info-area">
      <div class="subtitle">
        The Superpower to Build Any Business<br>
        and Product in the Age of AI
      </div>
      <div class="cover-bottom">
        <div class="author">
          Written by <strong>Justin Tsui</strong>
        </div>
        <div class="series-mark">
          ✦ &nbsp;FRAMEWORKS FOR THE NEW WORLD&nbsp; ✦
        </div>
      </div>
    </div>
  </div>
</div>

<p class="note">
  📸 Screenshot this page • Title: <strong>AI hand-lettered</strong> • Subtitle/Author: clean CSS
</p>

<script>
  const titleImg = document.getElementById('titleImg');
  const cover = document.getElementById('cover');
  const buttons = document.querySelectorAll('.switcher button');
  const variants = [
    { bg: 'url(bg_v2.jpg)', title: 'title_v1.jpg' },
    { bg: 'url(bg_v1.jpg)', title: 'title_v2.jpg' },
    { bg: 'url(bg_v3.jpg)', title: 'title_v3.jpg' }
  ];
  buttons.forEach((btn, i) => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      cover.style.backgroundImage = variants[i].bg;
      titleImg.src = variants[i].title;
    });
  });
  cover.style.backgroundImage = variants[0].bg;
</script>

</body>
</html>
