<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innovation SWAT — Premium Book Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: 'Cormorant Garamond', serif;
  }

  /* Book mockup frame */
  .book-frame {
    position: relative;
    width: 100%;
    max-width: 720px;  /* 6×9 at ~120px/inch */
    aspect-ratio: 2 / 3;
    background: #fff;
    border-radius: 4px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.05),
      inset 0 0 30px rgba(0,0,0,0.1);
    overflow: hidden;
    margin-bottom: 30px;
  }

  /* Background layer - AI generated */
  .cover-bg {
    position: absolute;
    inset: 0;
    background: url('gen_777_1.jpg') center/cover no-repeat;
    transition: opacity 0.8s ease;
  }

  .cover-bg.v2 { opacity: 0; }

  /* Dark gradient overlay for text readability */
  .cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.15) 0%,
      rgba(0,0,0,0.05) 30%,
      rgba(0,0,0,0.2) 60%,
      rgba(0,0,0,0.5) 100%
    );
    pointer-events: none;
  }

  /* Title art layer - AI hand-lettered */
  .title-art {
    position: absolute;
    top: 12%;
    left: 8%;
    width: 84%;
    z-index: 2;
    opacity: 0.9;
    transition: opacity 0.6s ease;
    mix-blend-mode: multiply;
  }

  .title-art img { width: 100%; height: auto; display: block; }

  /* CSS text overlays */
  .cover-text {
    position: absolute;
    z-index: 3;
    width: 100%;
    padding: 0 10%;
    text-align: center;
    pointer-events: none;
  }

  .subtitle {
    top: 48%;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px, 2.5vw, 22px);
    font-weight: 400;
    font-style: italic;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    letter-spacing: 0.04em;
    line-height: 1.5;
  }

  .author {
    bottom: 16%;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(13px, 2vw, 18px);
    font-weight: 300;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .tagline {
    bottom: 8%;
    font-family: 'Inter', sans-serif;
    font-size: clamp(9px, 1.2vw, 12px);
    font-weight: 400;
    color: rgba(255,215,150,0.8);
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  /* Subtle mock spine shadow on left */
  .spine-shadow {
    position: absolute;
    top: 0;
    left: 0;
    width: 6%;
    height: 100%;
    background: linear-gradient(90deg, rgba(0,0,0,0.12) 0%, transparent 100%);
    z-index: 4;
    pointer-events: none;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 24px;
  }

  .controls button {
    padding: 10px 24px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #ccc;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    transition: all 0.25s ease;
    backdrop-filter: blur(4px);
  }

  .controls button:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }

  .controls button.active {
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    color: #fff;
    border-color: #c0392b;
  }

  .info {
    text-align: center;
    color: #666;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    line-height: 1.8;
  }

  .info a { color: #e74c3c; text-decoration: none; }
  .info a:hover { text-decoration: underline; }

  /* Responsive */
  @media (max-width: 600px) {
    .book-frame { max-width: 360px; }
    .subtitle { font-size: clamp(11px, 3.5vw, 16px); }
    .author { font-size: clamp(10px, 2.8vw, 14px); }
    .tagline { font-size: clamp(7px, 1.8vw, 10px); }
  }
</style>
</head>
<body>

  <!-- Background selector -->
  <div class="controls">
    <button class="active" onclick="switchBg(1)">🌅 Background A</button>
    <button onclick="switchBg(2)">🌄 Background B</button>
    <button onclick="switchTitle(1)">🖌️ Title Style 1</button>
    <button onclick="switchTitle(2)">✒️ Title Style 2</button>
  </div>

  <!-- Book cover mockup -->
  <div class="book-frame" id="bookCover">
    <!-- Background image -->
    <div class="cover-bg" id="bg1" style="background-image:url('gen_777_1.jpg')"></div>
    <div class="cover-bg v2" id="bg2" style="background-image:url('gen_777_2.jpg')"></div>

    <!-- Overlay for text readability -->
    <div class="cover-overlay"></div>

    <!-- AI Hand-lettered title art -->
    <div class="title-art" id="titleArt1">
      <img src="gen_888_1.jpg" alt="INNOVATION SWAT hand-lettered">
    </div>
    <div class="title-art" id="titleArt2" style="opacity:0;">
      <img src="gen_888_2.jpg" alt="INNOVATION SWAT hand-lettered variant">
    </div>

    <!-- CSS text overlay -->
    <div class="cover-text subtitle">
      The Superpower to Build Any Business<br>
      and Product in the Age of AI
    </div>

    <div class="cover-text author">Written by Justin Tsui</div>
    <div class="cover-text tagline">✦ Frameworks for the New World ✦</div>

    <!-- Spine shadow -->
    <div class="spine-shadow"></div>
  </div>

  <div class="info">
    📖 <strong>6" × 9"</strong> book cover format &nbsp;•&nbsp;
    AI background via <a href="https://fal.ai" target="_blank">fal.ai</a> FLUX Pro Kontext
    &nbsp;•&nbsp; Title composited + CSS typography
  </div>

  <script>
    function switchBg(n) {
      document.getElementById('bg1').style.opacity = n === 1 ? '1' : '0';
      document.getElementById('bg2').style.opacity = n === 2 ? '1' : '0';
      document.querySelectorAll('.controls button').forEach((b,i) => {
        b.classList.toggle('active', (i < 2 && i === n-1) || (i >= 2));
      });
    }

    function switchTitle(n) {
      document.getElementById('titleArt1').style.opacity = n === 1 ? '0.9' : '0';
      document.getElementById('titleArt2').style.opacity = n === 2 ? '0.9' : '0';
      document.querySelectorAll('.controls button').forEach((b,i) => {
        b.classList.toggle('active', (i >= 2 && i-2 === n-1) || (i < 2));
      });
    }
  </script>

</body>
</html>
