<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovation SWAT — Book Cover v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+JP:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a1e;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 2rem;
    }

    /* ── Book container with 3D spine effect ── */
    .book {
      display: flex;
      filter: drop-shadow(0 30px 60px rgba(0,0,0,0.5)) drop-shadow(0 10px 20px rgba(0,0,0,0.3));
      max-width: 720px;
      width: 100%;
      transition: transform 0.3s ease;
    }
    .book:hover {
      transform: translateY(-6px);
    }

    /* ── Spine ── */
    .spine {
      width: 36px;
      min-height: 560px;
      background: linear-gradient(180deg, #d4654a 0%, #b84a30 50%, #9a3a22 100%);
      border-radius: 6px 0 0 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .spine::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 3px,
        rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
      );
      border-radius: 6px 0 0 6px;
      pointer-events: none;
    }
    .spine-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: rgba(255,255,255,0.85);
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
    }

    /* ── Front Cover ── */
    .cover {
      flex: 1;
      min-height: 560px;
      background: linear-gradient(160deg, #ff7b50 0%, #e8695e 25%, #d4654a 55%, #c0553e 80%, #b84a30 100%);
      border-radius: 0 6px 6px 0;
      padding: 3rem;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ── Warm gradient atmosphere (Pinterest-inspired: soft blend, atmospheric) ── */
    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 70% at 20% 20%, rgba(255,220,190,0.25) 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(200,80,50,0.20) 0%, transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% 50%, rgba(255,180,150,0.12) 0%, transparent 55%);
      pointer-events: none;
    }

    /* ── Organic paper-grain texture (Abstract Mood aesthetic) ── */
    .grain-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
    }

    /* ── Calligraphic brush-stroke lines (Pinterest: sumi-e inspiration) ── */
    .brush-strokes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .brush-strokes svg {
      width: 100%;
      height: 100%;
    }

    /* ── Floating ink-wash blossoms/dots ── */
    .ink-dots {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .ink-dot {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      filter: blur(2px);
    }
    .ink-dot:nth-child(1) { width: 140px; height: 140px; top: 10%; right: 8%; }
    .ink-dot:nth-child(2) { width: 80px; height: 80px; bottom: 25%; left: 5%; }
    .ink-dot:nth-child(3) { width: 200px; height: 200px; bottom: -5%; right: -5%;
      background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%); }
    .ink-dot:nth-child(4) { width: 50px; height: 50px; top: 45%; left: 15%;
      background: rgba(255,255,255,0.04); filter: blur(4px); }

    /* ── Accent bars ── */
    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, rgba(255,255,255,0.5) 0%, transparent 80%);
    }
    .accent-bar-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(270deg, rgba(255,255,255,0.4) 20%, transparent 80%);
    }

    /* ── Floating particles (glowing embers) ── */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255,220,190,0.6);
      border-radius: 50%;
      filter: blur(1px);
      animation: ember 6s infinite;
    }
    .particle:nth-child(1) { left: 20%; top: 25%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 50%; top: 15%; animation-delay: 1s; width: 4px; height: 4px; }
    .particle:nth-child(3) { left: 75%; top: 40%; animation-delay: 2.5s; }
    .particle:nth-child(4) { left: 35%; top: 65%; animation-delay: 1.5s; }
    .particle:nth-child(5) { left: 65%; top: 55%; animation-delay: 3.5s; width: 2px; height: 2px; }
    .particle:nth-child(6) { left: 85%; top: 75%; animation-delay: 4s; }
    .particle:nth-child(7) { left: 10%; top: 80%; animation-delay: 0.8s; }
    .particle:nth-child(8) { left: 45%; top: 85%; animation-delay: 2s; }
    @keyframes ember {
      0%   { opacity: 0; transform: translateY(0) scale(0.5); }
      25%  { opacity: 0.8; transform: translateY(-30px) scale(1.2); }
      75%  { opacity: 0.4; transform: translateY(-70px) scale(0.8); }
      100% { opacity: 0; transform: translateY(-100px) scale(0); }
    }

    /* ── Content ── */
    .cover-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: center;
    }

    /* ── Emblem (calligraphic circle — sumi-e inspired) ── */
    .emblem-area {
      margin-bottom: 1.8rem;
    }
    .emblem {
      width: 56px;
      height: 56px;
      position: relative;
    }
    .emblem-ring {
      width: 56px;
      height: 56px;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .emblem-ring::before {
      content: '✧';
      color: rgba(255,255,255,0.6);
      font-size: 1.4rem;
    }
    .emblem-ring::after {
      content: '';
      position: absolute;
      inset: -5px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.3rem 0.9rem;
      border-radius: 3px;
      font-family: 'Inter', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      font-weight: 400;
      margin-bottom: 2rem;
    }
    .badge-dot {
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
    }

    /* ── Title ── */
    .title-block {
      margin-bottom: 0.6rem;
    }
    .title-pre {
      font-family: 'Inter', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 0.5rem;
      font-weight: 400;
    }
    .title-main {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(3rem, 6vw, 4.2rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.02em;
      line-height: 1.05;
    }
    .title-main .swat {
      display: inline-block;
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      text-shadow: 0 2px 20px rgba(255,150,100,0.3);
      letter-spacing: 0.15em;
      position: relative;
    }
    .title-main .swat::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }

    /* ── Subtitle with brush-stroke left border (calligraphic influence) ── */
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      color: rgba(255,255,255,0.75);
      line-height: 1.6;
      max-width: 400px;
      font-weight: 300;
      letter-spacing: 0.03em;
      border-left: 3px solid rgba(255,255,255,0.3);
      padding-left: 1.2rem;
      margin-top: 1.2rem;
    }

    /* ── Bottom section ── */
    .cover-bottom {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 2rem;
    }
    .author {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .author strong {
      color: rgba(255,255,255,0.75);
      font-weight: 500;
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
    }
    .series-mark {
      font-family: 'Inter', sans-serif;
      font-size: 0.45rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.25);
      text-align: right;
    }
    .series-mark span {
      display: block;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body { padding: 1rem; }
      .spine { width: 24px; min-height: 400px; }
      .cover { min-height: 420px; padding: 1.5rem; }
      .cover-content { justify-content: flex-start; padding-top: 0.5rem; }
      .badge { margin-bottom: 1.2rem; }
      .emblem-area { margin-bottom: 1rem; }
      .emblem { width: 40px; height: 40px; }
      .emblem-ring { width: 40px; height: 40px; }
      .title-main { font-size: clamp(2rem, 8vw, 3rem); }
      .subtitle { font-size: 0.7rem; padding-left: 0.8rem; margin-top: 0.8rem; max-width: 280px; }
      .accent-bar, .accent-bar-bottom { height: 3px; }
    }

    @media print {
      body { background: white; padding: 0; }
      .book { filter: none; max-width: 100%; }
      .spine, .cover { min-height: 8.5in; }
      .particle { display: none; }
    }

    .note {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      z-index: 100;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="book">
  <!-- Spine -->
  <div class="spine">
    <span class="spine-text">Innovation SWAT</span>
  </div>

  <!-- Front Cover -->
  <div class="cover">
    <div class="accent-bar"></div>
    <div class="accent-bar-bottom"></div>
    <div class="grain-overlay"></div>

    <!-- Calligraphic brush-stroke lines (sumi-e Pinterest influence) -->
    <div class="brush-strokes">
      <svg viewBox="0 0 560 560" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Brush stroke 1 — sweeping top right -->
        <path d="M480 80 Q440 60 380 90 Q300 130 260 110 Q220 90 180 120 Q140 150 100 130" 
              stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" fill="none"
              stroke-dasharray="0 0" filter="url(#brush1)"/>
        <!-- Brush stroke 2 — bold accent mark -->
        <path d="M520 140 Q500 135 470 148 Q440 160 410 152 Q380 144 360 155" 
              stroke="rgba(255,255,255,0.06)" stroke-width="6" stroke-linecap="round" fill="none"/>
        <!-- Brush stroke 3 — subtle horizontal -->
        <path d="M40 340 Q80 330 140 345 Q200 360 260 340 Q320 320 380 338" 
              stroke="rgba(255,255,255,0.04)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- Brush stroke 4 — vertical accent -->
        <path d="M80 200 Q82 240 78 280 Q74 320 80 360 Q86 400 82 440" 
              stroke="rgba(255,255,255,0.03)" stroke-width="5" stroke-linecap="round" fill="none"/>
        <!-- Ink splatter dots -->
        <circle cx="490" cy="100" r="2" fill="rgba(255,255,255,0.06)"/>
        <circle cx="510" cy="110" r="1.5" fill="rgba(255,255,255,0.04)"/>
        <circle cx="475" cy="90" r="1" fill="rgba(255,255,255,0.05)"/>
      </svg>
    </div>

    <!-- Ink-wash soft dots (abstract floral/mist influence) -->
    <div class="ink-dots">
      <div class="ink-dot"></div>
      <div class="ink-dot"></div>
      <div class="ink-dot"></div>
      <div class="ink-dot"></div>
    </div>

    <!-- Floating ember particles -->
    <div class="particles">
      <div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div>
    </div>

    <!-- Content -->
    <div class="cover-content">
      <div class="badge">
        <span class="badge-dot"></span>
        A New Breed of Leadership
      </div>

      <div class="emblem-area">
        <div class="emblem">
          <div class="emblem-ring"></div>
        </div>
      </div>

      <div class="title-block">
        <div class="title-pre">A Manifesto for the Age of Intelligence</div>
        <h1 class="title-main">
          Innovation<br>
          <span class="swat">SWAT</span>
        </h1>
      </div>

      <div class="subtitle">
        The Superpower to Build Any Business<br>
        and Product in the Age of AI
      </div>
    </div>

    <!-- Bottom -->
    <div class="cover-bottom">
      <div class="author">
        Written by <strong>Justin Tsui</strong>
      </div>
      <div class="series-mark">
        <span>✦ &nbsp;FRAMEWORKS FOR THE NEW WORLD&nbsp; ✦</span>
      </div>
    </div>
  </div>
</div>

<div class="note">📸 Screenshot or print this page</div>

</body>
</html>
